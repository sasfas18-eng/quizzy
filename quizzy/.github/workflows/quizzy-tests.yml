name: quizzy-tests
on:
  push: { paths: ["quizzy/**"] }
  pull_request: { paths: ["quizzy/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r quizzy/backend/requirements.txt
      - run: cd quizzy/backend && python -m pytest -q
