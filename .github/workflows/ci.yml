name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - name: The owner's lecture_reader.py and its JavaScript port (Claude edition + ChatGPT app) decide every part of a lecture identically
        run: python3 shared/test/owner_rules_parity.py
      - name: The «كويزي» GPT package fits ChatGPT (instructions under 8000 characters) and carries the owner's ORIGINAL two files
        run: |
          python3 -c "t=open('docs/chatgpt-gpt/INSTRUCTIONS.txt',encoding='utf-8').read(); assert len(t)<8000, len(t); print('GPT instructions', len(t), 'chars')"
          echo "7b40b4fc904a9a37  docs/chatgpt-gpt/knowledge/lecture_reader.py" > /tmp/h && echo "f984fcba98bf2d38  docs/chatgpt-gpt/knowledge/quiz_engine.py" >> /tmp/h
          for f in lecture_reader quiz_engine; do sha256sum docs/chatgpt-gpt/knowledge/$f.py | cut -c1-16 | grep -qx "$(grep $f /tmp/h | cut -c1-16)"; done && echo "knowledge files are the owner's originals"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node claude-edition/test/engine.test.js && node claude-edition/test/engine_speed.test.js && node claude-edition/test/analysis_robust.test.js && node claude-edition/test/rules.test.js && node claude-edition/test/rules_samples.test.js && node claude-edition/test/count_guarantee.test.js && node claude-edition/test/size_adapt.test.js && node claude-edition/test/profile.test.js && node claude-edition/test/correction.test.js && node claude-edition/test/reflow.test.js && node claude-edition/test/types.test.js && node claude-edition/test/reports.test.js && node claude-edition/test/semantic.test.js && node claude-edition/test/composer.test.js && node claude-edition/test/coverage.test.js && node claude-edition/test/chrome_ai.test.js && node claude-edition/test/owner_ai.test.js && node claude-edition/test/section_forms.test.js && node claude-edition/test/whole_lecture.test.js && node claude-edition/test/options_quality.test.js && node claude-edition/test/pipeline.test.js && node claude-edition/test/sections_titles.test.js && node claude-edition/test/storage_gc.test.js && node claude-edition/test/full_coverage.test.js
      - run: node static-edition/test/stores.test.js && node static-edition/test/supabase_client.test.js && node static-edition/test/front_matter.test.js && node relay/test/worker.test.mjs
  docker:
    # builds the production image, runs it, drives the whole student journey over HTTP, restarts it and checks persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: docker build -t quizzy:ci .
      - name: run container (fresh root-owned volume => exercises the privilege drop)
        run: docker run -d --name quizzy -p 8000:8000 -v quizzy-ci:/data -e QUIZZY_ALLOW_FAKE_LLM=1 -e QUIZZY_ADMIN_EMAILS=admin@example.com quizzy:ci
      - run: python scripts/smoke.py http://127.0.0.1:8000 phase1
      - run: docker restart quizzy
      - run: python scripts/smoke.py http://127.0.0.1:8000 phase2
      - name: container health + user
        run: |
          docker inspect --format '{{.State.Health.Status}}' quizzy || true
          docker exec quizzy id
      - if: always()
        run: docker logs quizzy | tail -40
  web-edition:
    # the GitHub Pages edition: real PostgreSQL row-level-security test + real Chromium end-to-end runs (device mode with a
    # bring-your-own-key provider, and real-accounts mode against a fake Supabase), including the print-to-PDF page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-save playwright@1.64.0 embedded-postgres pg axe-core      # Pin a published pair of playwright/playwright-core; ONE install so a second --no-save does not prune packages.
      - run: npx playwright install --with-deps chromium
      - name: Supabase schema + RLS on a real PostgreSQL
        run: QZ_NODE_MODULES=$PWD/node_modules node supabase/test/rls.test.mjs
      - run: python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_pdf(Path('/tmp/cardiac.pdf'))"
      - name: In-browser reading of scanned pages (tesseract.js, pinned versions, sha512-checked; not committed)
        run: bash scripts/fetch_ocr.sh
      - name: The composer's open on-device model for every browser (transformers.js pinned + sha512; all-MiniLM-L6-v2 from Hugging Face, sha256 printed; not committed)
        run: bash scripts/fetch_semantic.sh
      - run: python3 static-edition/build.py /tmp/web-dist
      - run: node static-edition/test/run_web_local.js /tmp/web-dist /tmp/cardiac.pdf /tmp/web-quiz.pdf
      - run: node static-edition/test/run_web_supabase.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Website with NO key at all (upload -> questions built locally, nothing leaves the device)
        run: node static-edition/test/run_web_nokey.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Smart generation (#/smart) - two paths, ChatGPT and Claude, each with the student's own account; links out only, sends nothing, no key
        run: node static-edition/test/run_web_smart.js /tmp/web-dist
      - name: The stamped site (what GitHub publishes, ?v= on every script and module URL) still works in a real browser
        run: |
          cp -r /tmp/web-dist /tmp/web-stamped && python3 scripts/stamp_site.py /tmp/web-stamped
          node static-edition/test/run_web_nokey.js /tmp/web-stamped /tmp/cardiac.pdf
      - name: A NEW file can be uploaded right on the new-quiz page (button, several files, drag and drop, bad files), and a slow page never replaces the page you moved to
        run: node static-edition/test/run_web_newfile.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Many quizzes on the device (new file still uploads at once, lists read only what they show, unfinished quizzes cleared in one go) + full browser storage (clear message, nothing half-saved)
        run: node static-edition/test/run_web_many.js /tmp/web-dist /tmp/cardiac.pdf
      - name: A site without cloud accounts - the account is this device (normal, not a guest), the guest is a separate space, nothing written above the site
        run: node static-edition/test/run_web_account.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Accessibility scan (axe-core, WCAG 2.1 A/AA incl. colour contrast) of the main screens - light, dark and phone
        run: node scripts/a11y_scan.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Claude edition (inside claude.ai, simulated runtime) - one-step flow, with and without a signed-in viewer
        run: |
          mkdir -p /tmp/shots
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_pptx(Path('/tmp/deck.pptx'))"
          python3 claude-edition/build.py /tmp/ce-dist
          node claude-edition/test/run.js /tmp/ce-dist /tmp/cardiac.pdf /tmp/deck.pptx
          node claude-edition/test/run_local.js /tmp/ce-dist /tmp/cardiac.pdf
          node claude-edition/test/run_fallback.js /tmp/ce-dist /tmp/cardiac.pdf
          node claude-edition/test/run_owner.js /tmp/ce-dist      # the owner's reader + evidence rule on the Claude path
          node claude-edition/test/run_quota.js /tmp/ce-dist /tmp/cardiac.pdf      # the viewer's Claude quota runs out: told at once, quiz completed locally, never minutes of silence
          python3 claude-edition/test/make_sections_deck.py /tmp/sections_deck.pdf && node claude-edition/test/run_sections.js /tmp/ce-dist /tmp/sections_deck.pdf      # the lecture's own sections (its headings) reach Claude: forms per section, a section written together, every section covered
          python3 claude-edition/test/make_dense_deck.py /tmp/dense_deck.pdf && node claude-edition/test/run_count.js /tmp/ce-dist /tmp/dense_deck.pdf      # the full count from Claude alone, even when half the slots are refused and the reviewer is picky (a real quiz delivered 9 of 50)
          python3 claude-edition/test/make_long_deck.py /tmp/long_deck.pdf 40 && QZ_ASSERT=1 node claude-edition/test/run_speed_ui.js /tmp/ce-dist /tmp/long_deck.pdf      # a network store like claude.ai's (200 ms a call): upload 40 slides, home, quizzes, delete files and quizzes - each within its limit, nothing left behind
          QZ_ASSERT=1 node claude-edition/test/speed_bench.js /tmp/ce-dist /tmp/cardiac.pdf 10 0 1500      # read ahead: the analysis runs while the student chooses (never twice)
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_notes_pdf(Path('/tmp/lecture_en.pdf'), 'lecture_en')"
          QZ_BASE=400 QZ_PER='{"generate":490,"verify":130,"explain":80,"analyze":250,"reading":40}' QZ_MAX_S=75 node claude-edition/test/speed_bench.js /tmp/ce-dist /tmp/lecture_en.pdf 30 0 1500
          QZ_BASE=380 QZ_PER='{"generate":106,"verify":8,"explain":4,"analyze":70,"reading":5}' QZ_MAX_S=100 node claude-edition/test/speed_bench.js /tmp/ce-dist /tmp/dense_deck.pdf 50 7 200      # the answer times of a real account's log (one request: write 9 s for 5, check 4 s, analyse 7 s), 7 at once, the student clicks at once: 50 questions, analysis included, within 100 s      # a real account's answer times (calibrated on a measured 183 s quiz): 30 questions within 75 s
      - name: Server edition UI in Chromium (one click -> quiz, hidden question types, generation continues after leaving the page)
        run: |
          cd backend && (QUIZZY_DATA_DIR=/tmp/ui-data QUIZZY_ALLOW_FAKE_LLM=1 nohup python -m uvicorn app.main:app --port 8766 > /tmp/ui-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/api/auth/capabilities >/dev/null && break; sleep 1; done
          cd .. && node scripts/e2e_server_ui.js http://127.0.0.1:8766 /tmp/cardiac.pdf
      - name: realistic slides / notes (regression for "تعذر استخراج أهداف قابلة للاختبار")
        run: |
          mkdir -p /tmp/fx && python3 - <<'PY'
          import sys; from pathlib import Path
          sys.path.insert(0, 'backend'); from tests import fixtures
          d = Path('/tmp/fx')
          fixtures.make_slides_pptx(d / 'slides_en.pptx', 'slides_en'); fixtures.make_slides_pptx(d / 'slides_ar.pptx', 'slides_ar')
          fixtures.make_diagram_pptx(d / 'diagram.pptx')
          fixtures.make_notes_pdf(d / 'notes_en.pdf', 'notes_en'); fixtures.make_notes_pdf(d / 'dense_en.pdf', 'dense_en')
          fixtures.make_sparse_pdf(d / 'sparse.pdf')
          fixtures.make_notes_pdf(d / 'lecture_en.pdf', 'lecture_en')
          fixtures.make_paper_pdf(d / 'paper_2col.pdf')
          PY
          node static-edition/test/run_web_realistic.js /tmp/web-dist /tmp/fx
      - name: A real-world PDF layout (two columns, hyphens at line ends, references) is read back into sentences and gives whole-sentence questions without AI
        run: node static-edition/test/run_web_reflow.js /tmp/web-dist /tmp/fx/paper_2col.pdf
      - name: The lecture's text is read from everything the file carries (PowerPoint SmartArt and charts, no OCR); OCR only for a lecture of pictures; no unreadable text in a question
        run: node static-edition/test/run_web_textsources.js /tmp/web-dist /tmp/fx/diagram.pptx /tmp/cardiac.pdf
      - name: The site's language switch (العربية / English) - every page and state in English with no Arabic interface text left, the lecture's own content untouched, left-to-right on a phone too, remembered, and back to Arabic exactly
        run: node static-edition/test/run_web_lang.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Flashcards do not keep the student waiting (AI parts in parallel and spread over the lecture, a slow provider is not waited for, local cards spread over the pages)
        run: node static-edition/test/run_web_cards.js /tmp/web-dist
      - name: The composer handles the students' reports (a reported question never comes back, a wrongly-answered fact is not asked again by that form, the form is weighed down); the operator sees and resets them
        run: node static-edition/test/run_web_reports.js /tmp/web-dist /tmp/cardiac.pdf
      - name: The composer's zero-cost AI - the model built into the browser (simulated) - checks the questions on the device, within 10 s; nothing leaves the machine
        run: node static-edition/test/run_web_chromeai.js /tmp/web-dist /tmp/cardiac.pdf
      - name: The composer's OPEN model, REAL, in Chromium (Chrome / Edge) - read for meaning on the device, the count kept, nothing leaves the machine
        run: node static-edition/test/run_web_semantic.js /tmp/web-dist /tmp/cardiac.pdf chromium
      - name: The same in Firefox and in WebKit (Safari's engine) - every browser
        run: |
          npx playwright install --with-deps firefox webkit
          node static-edition/test/run_web_semantic.js /tmp/web-dist /tmp/cardiac.pdf firefox
          node static-edition/test/run_web_semantic.js /tmp/web-dist /tmp/cardiac.pdf webkit
      - name: An OLD PowerPoint file (.ppt, 97-2003) is read in the browser - slides in presentation order - and gives a quiz without AI
        run: node static-edition/test/run_web_ppt.js /tmp/web-dist
      - name: A SCANNED lecture (pages that are pictures) is read in the browser with visible progress and gives a quiz; without the reading files it is refused honestly
        run: |
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_scanned_pdf(Path('/tmp/fx/scan_slides.pdf'))"
          rm -rf /tmp/web-noocr && cp -r /tmp/web-dist /tmp/web-noocr && rm -rf /tmp/web-noocr/vendor/ocr
          node static-edition/test/run_web_ocr.js /tmp/web-dist /tmp/web-noocr /tmp/fx/scan_slides.pdf
      - name: «My files» tidies itself up - delete a file from its row, tick several (or select all) and delete them at once, clear every unreadable file with one button; quizzes keep their questions
        run: node static-edition/test/run_web_files_delete.js /tmp/web-dist /tmp/web-noocr /tmp/cardiac.pdf /tmp/fx/scan_slides.pdf
      - name: AI-written quizzes for every visitor via the site's relay (a free Gemini key kept on a Cloudflare Worker, never in the site) - with automatic local fallback when the relay / free quota fails, and no key ever sent by the site
        run: node static-edition/test/run_web_relay.js /tmp/web-dist /tmp/cardiac.pdf
  deploy:
    name: publish the site (GitHub Pages)
    # Every change that passes ALL the tests above is published to the site by GitHub itself (no manual step, no other link to update).
    needs: [test, docker, web-edition]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site, keep the published config.js, apply the QZ_SUPABASE_* and QZ_CHROME_AI_TOKEN repository variables (Settings > Secrets and variables > Actions > Variables; an address, the PUBLIC anon key, a public origin-trial token - never a secret), push to gh-pages
        env:
          VAR_CHROME_AI: ${{ vars.QZ_CHROME_AI_TOKEN }}
          VAR_SB_URL: ${{ vars.QZ_SUPABASE_URL }}
          VAR_SB_KEY: ${{ vars.QZ_SUPABASE_ANON_KEY }}
          VAR_RELAY: ${{ vars.QZ_RELAY }}
          VAR_RELAY_MODEL: ${{ vars.QZ_RELAY_MODEL }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -n "$VAR_CHROME_AI" ]; then export QZ_CHROME_AI_TOKEN="$VAR_CHROME_AI"; fi
          if [ -n "$VAR_SB_URL" ]; then export QZ_SUPABASE_URL="$VAR_SB_URL"; fi
          if [ -n "$VAR_SB_KEY" ]; then export QZ_SUPABASE_ANON_KEY="$VAR_SB_KEY"; fi
          if [ -n "$VAR_RELAY" ]; then export QZ_RELAY="$VAR_RELAY"; fi
          if [ -n "$VAR_RELAY_MODEL" ]; then export QZ_RELAY_MODEL="$VAR_RELAY_MODEL"; fi
          bash scripts/fetch_ocr.sh || echo 'ocr files unavailable: the site is published without in-browser reading of scanned pages'
          bash scripts/fetch_semantic.sh || echo 'open model unavailable: the site is published without it (the composer works as before)'
          bash scripts/deploy_pages.sh
