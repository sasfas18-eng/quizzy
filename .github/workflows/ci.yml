name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node claude-edition/test/engine.test.js && node claude-edition/test/engine_speed.test.js && node claude-edition/test/analysis_robust.test.js && node claude-edition/test/rules.test.js && node claude-edition/test/rules_samples.test.js && node claude-edition/test/count_guarantee.test.js && node claude-edition/test/size_adapt.test.js
      - run: node static-edition/test/pool.test.js && node static-edition/test/json_robust.test.js && node static-edition/test/supabase_client.test.js
      - name: Claude relay (holds the key server-side)
        run: node relay/test/worker.test.mjs
  docker:
    # builds the production image, runs it, drives the whole student journey over HTTP, restarts it and checks persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: docker build -t quizzy:ci .
      - name: run container (fresh root-owned volume => exercises the privilege drop)
        run: docker run -d --name quizzy -p 8000:8000 -v quizzy-ci:/data -e QUIZZY_ALLOW_FAKE_LLM=1 -e QUIZZY_ADMIN_EMAILS=admin@example.com quizzy:ci
      - run: python scripts/smoke.py http://127.0.0.1:8000 phase1
      - run: docker restart quizzy
      - run: python scripts/smoke.py http://127.0.0.1:8000 phase2
      - name: container health + user
        run: |
          docker inspect --format '{{.State.Health.Status}}' quizzy || true
          docker exec quizzy id
      - if: always()
        run: docker logs quizzy | tail -40
  web-edition:
    # the GitHub Pages edition: real PostgreSQL row-level-security test + real Chromium end-to-end runs (device mode with a
    # bring-your-own-key provider, and real-accounts mode against a fake Supabase), including the print-to-PDF page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-save playwright embedded-postgres pg
      - run: npx playwright install --with-deps chromium
      - name: Supabase schema + RLS on a real PostgreSQL
        run: QZ_NODE_MODULES=$PWD/node_modules node supabase/test/rls.test.mjs
      - run: python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_pdf(Path('/tmp/cardiac.pdf'))"
      - run: python3 static-edition/build.py /tmp/web-dist
      - run: node static-edition/test/run_web_local.js /tmp/web-dist /tmp/cardiac.pdf /tmp/web-quiz.pdf
      - run: node static-edition/test/run_web_supabase.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Website with NO key at all (upload -> questions built locally, nothing leaves the device)
        run: node static-edition/test/run_web_nokey.js /tmp/web-dist /tmp/cardiac.pdf
      - name: The stamped site (what GitHub publishes, ?v= on every script and module URL) still works in a real browser
        run: |
          cp -r /tmp/web-dist /tmp/web-stamped && python3 scripts/stamp_site.py /tmp/web-stamped
          node static-edition/test/run_web_nokey.js /tmp/web-stamped /tmp/cardiac.pdf
      - name: AI box for the operator only + Claude for everyone through the relay (the secret never reaches a browser) + automatic local fallback
        run: node static-edition/test/run_web_operator.js /tmp/web-dist /tmp/cardiac.pdf
      - name: Claude edition (inside claude.ai, simulated runtime) - one-step flow, with and without a signed-in viewer
        run: |
          mkdir -p /tmp/shots
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from tests import fixtures; fixtures.make_pptx(Path('/tmp/deck.pptx'))"
          python3 claude-edition/build.py /tmp/ce-dist
          node claude-edition/test/run.js /tmp/ce-dist /tmp/cardiac.pdf /tmp/deck.pptx
          node claude-edition/test/run_local.js /tmp/ce-dist /tmp/cardiac.pdf
          node claude-edition/test/run_fallback.js /tmp/ce-dist /tmp/cardiac.pdf
      - name: Server edition UI in Chromium (one click -> quiz, hidden question types, generation continues after leaving the page)
        run: |
          cd backend && (QUIZZY_DATA_DIR=/tmp/ui-data QUIZZY_ALLOW_FAKE_LLM=1 nohup python -m uvicorn app.main:app --port 8766 > /tmp/ui-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/api/auth/capabilities >/dev/null && break; sleep 1; done
          cd .. && node scripts/e2e_server_ui.js http://127.0.0.1:8766 /tmp/cardiac.pdf
      - name: realistic slides / notes (regression for "تعذر استخراج أهداف قابلة للاختبار")
        run: |
          mkdir -p /tmp/fx && python3 - <<'PY'
          import sys; from pathlib import Path
          sys.path.insert(0, 'backend'); from tests import fixtures
          d = Path('/tmp/fx')
          fixtures.make_slides_pptx(d / 'slides_en.pptx', 'slides_en'); fixtures.make_slides_pptx(d / 'slides_ar.pptx', 'slides_ar')
          fixtures.make_notes_pdf(d / 'notes_en.pdf', 'notes_en'); fixtures.make_notes_pdf(d / 'dense_en.pdf', 'dense_en')
          fixtures.make_sparse_pdf(d / 'sparse.pdf')
          fixtures.make_notes_pdf(d / 'lecture_en.pdf', 'lecture_en')
          PY
          node static-edition/test/run_web_realistic.js /tmp/web-dist /tmp/fx
  deploy:
    name: publish the site (GitHub Pages)
    # Every change that passes ALL the tests above is published to the site by GitHub itself (no manual step, no other link to update).
    needs: [test, docker, web-edition]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site, keep the published config.js, apply the QZ_RELAY* repository variables (Settings > Secrets and variables > Actions > Variables; an address, never a key), push to gh-pages
        env:
          VAR_RELAY: ${{ vars.QZ_RELAY }}
          VAR_RELAY_MODEL: ${{ vars.QZ_RELAY_MODEL }}
          VAR_RELAY_RPM: ${{ vars.QZ_RELAY_RPM }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -n "$VAR_RELAY" ]; then export QZ_RELAY="$VAR_RELAY"; fi
          if [ -n "$VAR_RELAY_MODEL" ]; then export QZ_RELAY_MODEL="$VAR_RELAY_MODEL"; fi
          if [ -n "$VAR_RELAY_RPM" ]; then export QZ_RELAY_RPM="$VAR_RELAY_RPM"; fi
          bash scripts/deploy_pages.sh
